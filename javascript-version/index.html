<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Candy Dash</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a0a28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ff8800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            border: 3px solid #ff8800;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .controls {
            margin-top: 20px;
            color: white;
            text-align: center;
        }

        .controls p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Halloween Candy Dash</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls">
        <p>Use Arrow Keys to move</p>
        <p>Collect candy and avoid bats and spiders!</p>
        <p>Press SPACE to restart after game over</p>
    </div>
    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Halloween Candy Dash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a0a28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 10px;
        }

        h1 {
            color: #ff8800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-align: center;
        }

        #canvasWrapper {
            position: relative;
            max-width: 100%;
            max-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            border: 3px solid #ff8800;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }

        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 10, 40, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #startOverlay.hidden {
            display: none;
        }

        #startButton {
            background: linear-gradient(135deg, #ff8800, #ff5500);
            color: white;
            font-size: clamp(1.2rem, 4vw, 2rem);
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 136, 0, 0.4);
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #startButton:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(255, 136, 0, 0.4);
        }

        .controls {
            margin-top: 10px;
            color: white;
            text-align: center;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
        }

        .controls p {
            margin: 5px 0;
        }

        @media (orientation: landscape) and (max-height: 600px) {
            h1 {
                font-size: 1.2rem;
                margin-bottom: 5px;
            }

            #canvasWrapper {
                max-height: calc(100vh - 80px);
            }

            .controls {
                font-size: 0.7rem;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="startOverlay">
        <h1>🎃 Halloween Candy Dash 🎃</h1>
        <p style="color: white; text-align: center; margin: 20px; font-size: clamp(0.9rem, 3vw, 1.2rem);">
            Collect candy 🍬<br>
            Avoid bats 🦇 and spiders 🕷️<br>
            <br>
            <span style="font-size: 0.9em; opacity: 0.8;">
                Desktop: Use arrow keys<br>
                Mobile: Touch to move
            </span>
        </p>
        <button id="startButton">Start Game</button>
    </div>

    <div id="gameContainer">
        <h1>Halloween Candy Dash</h1>
        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        <div class="controls">
            <p id="controlsText">Touch screen to move • Collect candy • Avoid enemies</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
